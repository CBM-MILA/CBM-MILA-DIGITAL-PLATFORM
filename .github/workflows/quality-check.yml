name: Quality Checks

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests and syntax checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Run regression suite
        run: python -m pytest -q

      - name: Check Python syntax
        run: python -m py_compile scraper.py scripts/notify_failure.py scripts/validate_data.py

      - name: Check JavaScript syntax
        shell: bash
        run: |
          node --check app.js
          node --check sw.js
          node --check config.js
          node --check < Code.gs
          node --check tests/live_control.test.js
          node --check tests/app_live_match.test.js
